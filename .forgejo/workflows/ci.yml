name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps + offscreen Qt platform deps
        run: |
          set -eux
          sudo apt-get update
          # libegl1 / libxkbcommon0 / libdbus-1-3 cover the shared libs PyQt6
          # wheels dlopen at import time even under QT_QPA_PLATFORM=offscreen.
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: gitleaks
        # Scan full history on push to main; staged diff is already covered
        # by the pre-commit hook. Use --no-git for forks/runners that don't
        # have full history fetched.
        run: |
          set -eux
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose

      - name: py_compile
        run: python -m py_compile flash_ops.py main.py internet_panel.py udev_check.py app_logging.py

      - name: pytest
        # --cov measures coverage; no --cov-fail-under yet — first establish
        # the floor by reading the report on a few runs, then gate. Ticket
        # tracks the threshold bump.
        run: pytest -q --cov=. --cov-report=term-missing --cov-report=xml

      - name: Headless Qt boot smoke
        env:
          QT_QPA_PLATFORM: offscreen
          # Avoid hitting the real API during construction; LoadDevicesWorker
          # will fail-fast against an unroutable host and the GUI surfaces an
          # error label rather than blocking import.
          HDZERO_API_BASE: http://127.0.0.1:1
        run: |
          python - <<'PY'
          import sys
          from PyQt6.QtWidgets import QApplication
          app = QApplication(sys.argv)
          import main
          w = main.MainWindow()
          w.show()
          assert w.panel_local.cb_autobackup.isChecked() is True
          assert w.panel_internet.cb_autobackup.isChecked() is True
          # FlashWorker constructor accepts the new backup_path kwarg.
          from flash_ops import FlashWorker
          fw = FlashWorker("/usr/bin/flashrom", "/tmp/x.bin", backup_path="/tmp/b.bin")
          assert fw.backup_path == "/tmp/b.bin"
          print("smoke ok")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  appimage:
    runs-on: ubuntu-22.04
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          set -eux
          sudo apt-get update
          # appimagetool needs FUSE at runtime; CI containers usually lack
          # /dev/fuse, so we set APPIMAGE_EXTRACT_AND_RUN=1 below to bypass.
          sudo apt-get install -y --no-install-recommends \
            file desktop-file-utils zsync wget
          python -m pip install --upgrade pip
          pip install pipx
          # Pin python-appimage so a future upstream change can't silently
          # break the build. Bump deliberately when validated.
          pipx install 'python-appimage==0.34'

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          bash packaging/build-appimage.sh

      - name: Inspect artifact
        run: |
          set -eux
          ls -lh dist/
          file dist/HDZeroProgrammer-x86_64.AppImage

      - name: AppImage launch smoke (--version)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eux
          chmod +x dist/HDZeroProgrammer-x86_64.AppImage
          out=$(./dist/HDZeroProgrammer-x86_64.AppImage --version)
          echo "$out"
          echo "$out" | grep -E "^hdzero-programmer [0-9]+\.[0-9]+\.[0-9]+"

      - name: AppImage --check-rule smoke
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Force the no-escalate path so the check exits 0 on the CI runner
          # which has no CH341A udev rule installed.
          HDZERO_NO_ESCALATE: "1"
        run: |
          set -eux
          ./dist/HDZeroProgrammer-x86_64.AppImage --check-rule

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: HDZeroProgrammer-x86_64.AppImage
          path: dist/HDZeroProgrammer-x86_64.AppImage
          if-no-files-found: error
