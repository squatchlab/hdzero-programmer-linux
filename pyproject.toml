[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdzero-programmer"
version = "0.3.0"
description = "Linux desktop GUI for flashing HDZero VTX firmware via a CH341A USB SPI programmer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Gunther Votteler" },
]
maintainers = [
    { name = "bMags", email = "bryan.magalski@gmail.com" },
]
keywords = ["hdzero", "vtx", "fpv", "flashrom", "ch341a", "firmware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.6,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.urls]
Homepage = "https://forgejo.squatch.lab/bmags/hdzero-programmer-linux"
Upstream = "https://github.com/gvotteler/HDZero-Programmer-Tool-Mac"

[project.gui-scripts]
hdzero-programmer = "main:main"

[tool.setuptools]
py-modules = ["main", "internet_panel", "flash_ops", "udev_check", "app_logging", "app_settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
# Safety-critical modules carry strict typing. main + internet_panel sit
# on PyQt6 (no first-party stubs) and run too much UI glue to be
# `--strict` without an `Any` ocean. The first pass keeps them at
# import-and-explicit-signature checking only; tightening to
# `disallow_untyped_defs` is a deliberate follow-up.
python_version = "3.10"
files = [
    "flash_ops.py",
    "udev_check.py",
    "app_logging.py",
    "app_settings.py",
    "main.py",
    "internet_panel.py",
]
strict = false
warn_unused_ignores = true

# PyQt6 ships no stubs (community PyQt6-stubs lags the wheel cadence
# and breaks CI when out of date). Treating the namespace as untyped
# is a deliberate trade-off; safety-critical code calls QThread /
# pyqtSignal sparingly so the Any blast radius is small.
[[tool.mypy.overrides]]
module = ["PyQt6.*"]
ignore_missing_imports = true

# Strict surface — flashrom argv contracts, privilege escalation,
# udev probe, transcript file path resolution, settings migration. A
# single None-where-Path or wrong-shaped tuple here ships as an
# AttributeError at flash time; mypy is cheap insurance.
[[tool.mypy.overrides]]
module = ["flash_ops", "udev_check", "app_logging", "app_settings"]
strict = true

# main + internet_panel are UI plumbing on top of PyQt6 (which has no
# first-party stubs). disallow_untyped_defs keeps the bar at "every
# def has a typed signature" so cross-module signature drift surfaces.
# Full strict isn't worth the Any-cast cost on Qt boilerplate, but
# typed defs catch the bug class that matters: a slot connected with
# the wrong arg shape, or a helper that loses an argument silently.
[[tool.mypy.overrides]]
module = ["main", "internet_panel"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors/warnings (E/W), and isort (I) cover the
# bug-class lint we actually care about. The ignores below preserve the
# upstream code style this project inherited from the macOS fork — compact
# multi-statement lines and mixed-import lines are deliberate.
select = ["E", "F", "W", "I"]
ignore = [
    "E401",  # multiple imports on one line — codebase style
    "E701",  # multiple statements on one line (colon) — same
    "E702",  # statement ends with semicolon — same
    "E501",  # line too long — line-length already permissive
    "W293",  # blank line contains whitespace — cosmetic
]
