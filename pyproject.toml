[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdzero-programmer"
version = "0.2.0"
description = "Linux desktop GUI for flashing HDZero VTX firmware via a CH341A USB SPI programmer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Gunther Votteler" },
]
maintainers = [
    { name = "bMags", email = "bryan.magalski@gmail.com" },
]
keywords = ["hdzero", "vtx", "fpv", "flashrom", "ch341a", "firmware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.6,<6.9",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://forgejo.squatch.lab/bmags/hdzero-programmer-linux"
Upstream = "https://github.com/gvotteler/HDZero-Programmer-Tool-Mac"

[project.gui-scripts]
hdzero-programmer = "main:main"

[tool.setuptools]
py-modules = ["main", "internet_panel", "flash_ops", "udev_check", "app_logging", "app_settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors/warnings (E/W), and isort (I) cover the
# bug-class lint we actually care about. The ignores below preserve the
# upstream code style this project inherited from the macOS fork — compact
# multi-statement lines and mixed-import lines are deliberate.
select = ["E", "F", "W", "I"]
ignore = [
    "E401",  # multiple imports on one line — codebase style
    "E701",  # multiple statements on one line (colon) — same
    "E702",  # statement ends with semicolon — same
    "E501",  # line too long — line-length already permissive
    "W293",  # blank line contains whitespace — cosmetic
]
